<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<style type="text/css">
    @media (min-width: 768px) {
        html {
            font-size: 16px;
        }
    }

    .container {
    max-width: 960px;
    }

    .pricing-header {
    max-width: 700px;
    }

    .card-deck .card {
    min-width: 220px;
    }

    .site-title {
        margin-right: auto;
    }

    .border-top { border-top: 1px solid #e5e5e5; }
    .border-bottom { border-bottom: 1px solid #e5e5e5; }

    .box-shadow { box-shadow: 0 .25rem .75rem rgba(0, 0, 0, .05); }
</style>

<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="site-title my-0 mr-md-auto font-weight-normal">
        <a href="{% url 'home' %}">Finance Tracker</a>
    </h5>
    <nav class="my-2 my-md-0 mr-md-3">
    {% if request.user.is_authenticated %}
        <a class="p-2 text-dark" href="{% url 'account' %}">{{request.user.username}}</a>
        <a class="p-2 text-dark" href="{% url 'logout' %}">Logout</a>
    {% else %}
        <a class="p-2 text-dark" href="{% url 'login' %}">Sign In</a>
        <a class="btn btn-outline-primary" href="{% url 'register' %}">Register</a>
    {% endif %}
</nav>
</div>
