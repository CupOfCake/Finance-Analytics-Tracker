{% load static %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style type="text/css">
    /* ------- Import Poppins for consistency ------- */
    body {
        font-family: 'Poppins', sans-serif;
    }

    /* ------- Header specific styles ------- */
    .site-header {
        background: #fff;
        border-bottom: 1px solid #e5e5e5;
        box-shadow: 0 .25rem .75rem rgba(0, 0, 0, .05);
        padding: 0.75rem 1.5rem;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
    }
    .main {
        padding-top: 0.75rem; /* adjust if your header height differs */
    }

    .logo-text {
        color: #008080;           /* deep teal – matches logo */
        font-weight: 700;
        font-size: 1.25rem;
        letter-spacing: -0.5px;
        margin-left: 10px;
        transition: color 0.2s ease;
    }

    .logo-link:hover .logo-text {
        color: #00555a;           /* darker teal on hover */
    }

    .logo-link {
        text-decoration: none;
        display: flex;
        align-items: center;
    }

    /* ------- Navigation links ------- */
    .nav-link-custom {
        color: #4a5568;
        font-weight: 500;
        font-size: 0.95rem;
        padding: 0.5rem 1rem;
        border-radius: 40px;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-block;
    }

    .nav-link-custom:hover {
        color: #008080;
        background: rgba(0, 128, 128, 0.08);
        transform: translateY(-1px);
    }

    .nav-link-custom.username {
        color: #008080;
        font-weight: 600;
    }

    .nav-link-custom.username:hover {
        background: rgba(0, 128, 128, 0.12);
    }

    /* ------- Button styles (match login page) ------- */
    .btn-teal-outline {
        background: transparent;
        border: 2px solid #008080;
        border-radius: 40px;
        padding: 0.4rem 1.5rem;
        font-weight: 600;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #008080;
        transition: all 0.25s ease;
        text-decoration: none;
        display: inline-block;
    }

    .btn-teal-outline:hover {
        background: #008080;
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 128, 128, 0.3);
    }

    .btn-teal-gradient {
        background: linear-gradient(135deg, #23adad 0%, #00555a 100%);
        border: none;
        border-radius: 40px;
        padding: 0.4rem 1.5rem;
        font-weight: 600;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #fff;
        transition: all 0.25s ease;
        text-decoration: none;
        display: inline-block;
    }

    .btn-teal-gradient:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 128, 128, 0.3);
        color: #fff;
    }

    /* ------- Mobile adjustments ------- */
    @media (max-width: 767px) {
        .site-header {
            padding: 0.5rem 1rem;
        }

        .logo-text {
            font-size: 1rem;
        }

        .nav-link-custom {
            font-size: 0.85rem;
            padding: 0.3rem 0.7rem;
        }

        .btn-teal-outline,
        .btn-teal-gradient {
            font-size: 0.75rem;
            padding: 0.3rem 1rem;
        }
    }

    /* ------- Keep container styles from before ------- */
    .container {
        max-width: 960px;
    }

    .pricing-header {
        max-width: 700px;
    }

    .card-deck .card {
        min-width: 220px;
    }

    .border-top { border-top: 1px solid #e5e5e5; }
    .border-bottom { border-bottom: 1px solid #e5e5e5; }
    .box-shadow { box-shadow: 0 .25rem .75rem rgba(0, 0, 0, .05); }
</style>

<div class="d-flex flex-column flex-md-row align-items-center site-header">
    <!-- Logo -->
    <a href="{% url 'home' %}" class="logo-link me-auto">
        <img src="{% static 'FTleaf2.png' %}" alt="FinanceTracker Logo" height="45">
        <span class="logo-text">Finance Tracker</span>
    </a>

    <!-- Navigation -->
    <nav class="my-2 my-md-0">
        {% if request.user.is_authenticated %}
            <a class="nav-link-custom username" href="{% url 'account' %}">
                {{ request.user.username }}
            </a>
            <a class="nav-link-custom" href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a class="nav-link-custom" href="{% url 'login' %}">Log In</a>
            <a class="btn-teal-gradient" href="{% url 'register' %}">Sign Up</a>
        {% endif %}
    </nav>
</div>
