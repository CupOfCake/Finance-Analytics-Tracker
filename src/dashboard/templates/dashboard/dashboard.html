{% extends 'base.html' %}

{% block content %}

{% load static currency_filters %}


<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: #f0f2f5;
        min-height: 100vh;
    }

    .dashb-section {
        padding: clamp(2rem, 6vw, 3rem) 0;
    }

    .dashboard-wrapper {
        max-width: 1100px;
        margin: 0 auto;
    }

    .dashboard-card {
        background: #fff;
        border-radius: 20px;
        padding: 2rem 1.5rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        height: 100%;
    }
</style>

<!-- load chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<section class="dashb-section">
    <div class="container dashboard-wrapper">
        <p>this is the dashboard</p>
        <div class="dashboard-card">
            <div style="flex: 1; background:#f0f2f5; border-radius:12px; padding:0.5rem; min-height:120px; position:relative;">
                {% if chart_data_json %}
                <canvas id="balanceChart" style="position:absolute; top:0; left:0; width:100%; height:100%;"></canvas>
                {% else %}
                <div style="display:flex; align-items:center; justify-content:center; color:#a0aec0; font-size:0.9rem; height:100%;">
                    No data for graph
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</section>



{% endblock content %}
